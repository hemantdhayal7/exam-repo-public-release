name: streamlit-keepalive

# Keeps the Smart MCQ Solver Streamlit Community Cloud container warm.
#
# NOTE: the app's real health endpoint sits behind the /~/+/ mount prefix.
# The bare https://genaiproject2026.streamlit.app/_stcore/health path returns
# the Community Cloud SPA shell with status 200 whether the app is alive or
# dead, so it is useless as a health signal. /~/+/_stcore/health returns "ok".

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping app health, wake if cold
        env:
          HEALTH: https://genaiproject2026.streamlit.app/~/+/_stcore/health
          APP: https://genaiproject2026.streamlit.app/
        run: |
          body=$(curl -s --max-time 45 "$HEALTH" || true)
          echo "health: [$body]"
          if [ "$body" = "ok" ]; then
            echo "container warm"
            exit 0
          fi
          echo "cold or asleep - loading full app page to force a wake"
          curl -s --max-time 90 -L -o /dev/null "$APP" || true
          sleep 20
          body2=$(curl -s --max-time 45 "$HEALTH" || true)
          echo "after wake: [$body2]"
          if [ "$body2" = "ok" ]; then
            echo "woke successfully"
          else
            echo "::error::app did not come back healthy"
            exit 1
          fi
